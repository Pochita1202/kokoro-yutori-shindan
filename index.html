<style>
/* ===== 心のゆとり診断 アプリ版（元LPの見た目に寄せた版。単体ページ／リザスト埋め込み共用） =====
   元LP（page/fast_scoring/3202）の実測値：
   teal #0097a7 / deep teal #006d79・#006064 / 設問ヘッダー水色 #ddfcfc + navy #1f3b5b /
   選択肢 #fafbfd + #dfe6ee、選択時 #eef6ff + #3b82c4 / 本文 M PLUS 1 / メインビジュアル＝明朝ネイビー #1e3f9e ＋黄色マーカー */

.yt-on {
  --paper: #ffffff;
  --paper-2: #f4fafc;
  --ink: #1f3b5b;
  --ink-soft: #5b6f84;
  --line: #e3eaf2;
  --teal: #0097a7;
  --teal-deep: #006d79;
  --aqua: #ddfcfc;        /* 設問ヘッダー・心の声 */
  --sel-bg: #eef6ff;
  --sel-line: #3b82c4;
  --navy: #1e3f9e;        /* メインビジュアルの明朝見出し */
  --marker: #ffe27a;      /* メインビジュアルの黄色マーカー */
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --hand: "Yusei Magic", "Noto Serif JP", "Hiragino Mincho ProN", serif; /* 手書き風（カードの愛称） */

  display: block; box-sizing: border-box; width: 100%; max-width: 430px; margin: 0 auto 40px;
  padding: 22px 22px 30px; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 22px rgba(31, 59, 91, .08);
  overflow: clip; /* ヒーローの角を丸める。clip は sticky を壊さない */
  font-family: var(--sans); font-size: 15px; line-height: 1.8; text-align: left;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}

/* --- ステージ制御（JSが form にクラスを付けた時だけ効く＝JS無効なら従来表示のまま） --- */
.yt-on #fast_scoring_items { display: none !important; }
.yt-on:not(.yt-stage-register) .page2-form-customer-block,
.yt-on:not(.yt-stage-register) #button,
.yt-on:not(.yt-stage-register) #errors { display: none !important; }
body.yt-immersive .freetextSec { display: none !important; }

#yutoriApp, #yutoriApp *, #yutoriApp *::before, #yutoriApp *::after { box-sizing: border-box; }
#yutoriApp p { margin: 0; }
#yutoriApp button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#yutoriApp .yt-screen { display: flex; flex-direction: column; gap: 26px; animation: ytIn .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes ytIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#yutoriApp mark, #yutoriApp .yt-mk { color: inherit; padding: 0 .08em;
  background: linear-gradient(transparent 60%, var(--marker) 60%, var(--marker) 92%, transparent 92%); }

/* --- 共通パーツ --- */
#yutoriApp .yt-sec { font-weight: 700; font-size: 15px; line-height: 1.5; color: #222; margin-bottom: 12px;
  padding: 3px 0 5px 10px; border-left: 4px solid var(--teal-deep); border-bottom: 2px solid var(--teal-deep); }
#yutoriApp .yt-chips { display: flex; gap: 8px; flex-wrap: wrap; }
#yutoriApp .yt-chip { font-size: 11.5px; letter-spacing: .06em; padding: 4px 11px; border-radius: 999px; line-height: 1.6;
  background: #fff; color: var(--teal-deep); border: 1px solid #b9e3e8; }
#yutoriApp .yt-chip.is-free { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700; }
#yutoriApp .yt-bubble { background: var(--aqua); border-radius: 18px 18px 18px 4px; padding: 10px 14px;
  font-size: 14.5px; line-height: 1.7; width: fit-content; max-width: 92%; white-space: pre-line; }
#yutoriApp .yt-bubble.is-r { align-self: flex-end; border-radius: 18px 18px 4px 18px; background: var(--sel-bg); }
#yutoriApp .yt-art img, #yutoriApp .yt-gift-ico svg { display: block; width: 100%; height: 100%; object-fit: cover; }
/* 入り口カードの丸窓：イラストの一部（顔まわり）をチラ見せ。固定サイズ＋背景画像＝古いブラウザでも崩れない */
#yutoriApp .yt-thumb { position: relative; width: 78px; height: 78px; border-radius: 50%; overflow: hidden; margin-top: 4px;
  background: #fff; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(31, 59, 91, .14); }
#yutoriApp .yt-thumb-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background-repeat: no-repeat; background-size: 250% auto; background-color: var(--type-bg, #eef4fa); }
#yutoriApp .is-blur .yt-thumb-img { filter: blur(4px); transform: scale(1.15); opacity: .85; }
#yutoriApp .yt-thumb-q { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1; color: var(--navy); text-shadow: 0 0 10px #fff, 0 0 4px #fff; }
/* 結果のイラスト：カードの端まで画面いっぱいに（正方形・枠なし）。周りの背景はイラストの地色（--type-bg）に合わせて一体化 */
#yutoriApp .yt-art { width: calc(100% + 44px); margin: 2px -22px 0; aspect-ratio: 1 / 1; background: var(--type-bg, #f3f9fe); }
#yutoriApp .yt-btn { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; border-radius: 50px; padding: 16px 18px;
  background: linear-gradient(358deg, #0097a7, #006064); color: #fff; font-weight: 700; font-size: 18px; line-height: 1.4;
  box-shadow: 0 8px 20px rgba(0, 109, 121, .28); letter-spacing: .04em; transition: transform .12s ease, filter .12s ease; }
#yutoriApp .yt-btn:hover { filter: brightness(1.08); }
#yutoriApp .yt-btn:active { transform: scale(.985); }
#yutoriApp button:focus-visible { outline: 3px solid rgba(59, 130, 196, .5); outline-offset: 3px; }

/* --- 入り口：メインビジュアル風ヒーロー（ページに本物のメインビジュアルがある時は出さない） --- */
#yutoriApp .yt-mv { margin: -22px -22px 0; padding: 28px 22px 22px; font-family: var(--serif); color: #222;
  background:
    radial-gradient(circle at 92% 18%, rgba(176, 214, 186, .55), transparent 42%),
    radial-gradient(circle at 8% 92%, rgba(255, 255, 255, .95), transparent 46%),
    radial-gradient(circle at 60% 40%, rgba(255, 255, 255, .7), transparent 38%),
    linear-gradient(135deg, #d6e6f7 0%, #eef6fd 52%, #dcebe6 100%); }
#yutoriApp .yt-mv-copy { font-weight: 700; line-height: 1.5; letter-spacing: .02em; }
#yutoriApp .yt-mv-copy .l1 { display: block; font-size: 23px; color: var(--navy); }
#yutoriApp .yt-mv-copy .l2 { display: block; font-size: 40px; line-height: 1.3; color: var(--navy); }
#yutoriApp .yt-mv-copy .l2 small { font-size: 22px; color: #222; }
#yutoriApp .yt-mv-copy .l3 { display: block; font-size: 22px; margin-top: 4px; }
#yutoriApp .yt-mv-copy .l4 { display: block; font-size: 30px; color: var(--navy); letter-spacing: .06em; }
#yutoriApp .yt-mv-name { margin-top: 14px; padding-top: 10px; border-top: 1.5px solid var(--navy);
  font-weight: 700; font-size: 19px; letter-spacing: .32em; color: var(--navy); white-space: nowrap; }
#yutoriApp .yt-mv-row { margin-top: 14px; display: flex; align-items: center; gap: 14px; }
#yutoriApp .yt-mv-badge { flex: none; width: 74px; height: 74px; border-radius: 50%; background: #fff; color: var(--navy);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; line-height: 1.15;
  box-shadow: 0 4px 14px rgba(30, 63, 158, .12); }
#yutoriApp .yt-mv-badge b { font-size: 25px; line-height: 1.1; }
#yutoriApp .yt-mv-sub { font-weight: 700; font-size: 15.5px; line-height: 1.6; color: var(--navy); padding-left: 14px; border-left: 1.5px solid var(--navy); }
#yutoriApp .yt-title { font-family: var(--serif); font-weight: 700; font-size: 25px; line-height: 1.45; margin: 0; color: var(--navy);
  letter-spacing: .04em; border: 0; padding: 0; background: none; }

#yutoriApp .yt-hero { display: flex; flex-direction: column; gap: 14px; }
#yutoriApp .yt-lede { color: var(--ink); font-size: 14.5px; }
#yutoriApp .yt-voices { display: flex; flex-direction: column; gap: 10px; }
#yutoriApp .yt-voices .yt-sec { margin-bottom: 4px; }
#yutoriApp .yt-note { font-size: 13.5px; margin-top: 6px; }
#yutoriApp .yt-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#yutoriApp .yt-types-img img { display: block; width: 100%; height: auto; }
#yutoriApp .yt-tcard { background: var(--type-bg, #fff); border: 1px solid rgba(255, 255, 255, .9); border-radius: 12px; padding: 8px 3px 10px;
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 3px 10px rgba(31, 59, 91, .06); }
#yutoriApp .yt-tcard b { font-family: var(--hand); font-size: 15px; line-height: 1.3; font-weight: 400; color: var(--navy); letter-spacing: 0; white-space: nowrap; margin-top: 2px; }
#yutoriApp .yt-tcard small { display: block; margin-top: -4px; font-size: 10.5px; line-height: 1.4; color: var(--ink-soft); }
#yutoriApp .yt-tcard.is-blur b, #yutoriApp .yt-tcard.is-blur small { color: transparent; text-shadow: 0 0 7px rgba(31, 59, 91, .55); }
#yutoriApp .yt-types-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; white-space: pre-line; }
#yutoriApp .yt-gift { display: flex; gap: 12px; align-items: flex-start; border: 1.5px dashed var(--teal); border-radius: 12px;
  padding: 12px 14px; background: #f7fdfe; }
#yutoriApp .yt-gift-ico { width: 46px; height: 46px; flex: none; }
#yutoriApp .yt-gift b { font-size: 14px; display: block; color: var(--teal-deep); }
#yutoriApp .yt-gift span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; display: block; white-space: pre-line; }
#yutoriApp .yt-who { display: flex; gap: 12px; align-items: flex-start; }
#yutoriApp .yt-avatar { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #f3faf6, #cfe6ee); border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(31, 59, 91, .15); display: grid; place-items: center; }
#yutoriApp .yt-avatar svg { width: 36px; height: 36px; }
#yutoriApp .yt-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
#yutoriApp .yt-who b { font-family: var(--serif); font-size: 14.5px; display: block; color: #222; }
#yutoriApp .yt-who p { margin-top: 2px; font-size: 13px; color: var(--ink-soft); line-height: 1.7; white-space: pre-line; }
#yutoriApp .yt-cta { position: sticky; bottom: 0; z-index: 2; margin-top: -8px; padding: 22px 0 12px;
  background: linear-gradient(transparent, var(--paper) 38%); }
#yutoriApp .yt-cta.is-static { position: static; margin-top: 0; padding: 0; background: none; }
#yutoriApp .yt-cta small { display: block; text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }

/* --- 質問：元LPの設問カード（水色ヘッダー＋選択肢）をそのまま1問ずつに --- */
#yutoriApp .yt-qbar { display: flex; align-items: center; gap: 12px; }
#yutoriApp .yt-back { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: #fff; color: var(--teal-deep); padding: 0; display: flex; align-items: center; justify-content: center; }
#yutoriApp .yt-back svg { display: block; margin-left: -1px; /* 矢印の見た目の重心を円の中央に */ }
#yutoriApp .yt-steps { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
#yutoriApp .yt-steps i { height: 6px; border-radius: 99px; background: #e8f1f5; transition: background .3s; }
#yutoriApp .yt-steps i.is-done { background: #7fcdd6; }
#yutoriApp .yt-steps i.is-now { background: var(--teal); }
#yutoriApp .yt-count { flex: none; font-size: 12.5px; font-weight: 700; color: var(--teal-deep); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
#yutoriApp .yt-qcard { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  box-shadow: 0 6px 22px rgba(31, 59, 91, .08); margin: 0 -6px; }
#yutoriApp .yt-q { background: var(--aqua); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 4px; min-height: 6.4em; }
#yutoriApp .yt-qno { font-weight: 700; font-size: 12px; color: var(--teal-deep); letter-spacing: .14em; }
#yutoriApp .yt-qtext { font-weight: 700; font-size: 18px; line-height: 1.55; color: var(--ink); }
#yutoriApp .yt-choices { display: flex; flex-direction: column; gap: 12px; padding: 18px 14px 18px; }
#yutoriApp .yt-choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 15px 14px;
  font-size: 15.5px; line-height: 1.55; color: #243447; background: #fafbfd; border: 1.5px solid #dfe6ee; border-radius: 12px;
  transition: background .15s, border-color .15s, transform .1s; }
#yutoriApp .yt-choice:hover { border-color: #9cc3e6; }
#yutoriApp .yt-choice:active { transform: scale(.985); }
#yutoriApp .yt-dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8a97a6; background: #fff; position: relative; }
#yutoriApp .yt-choice.is-selected { background: var(--sel-bg); border-color: var(--sel-line); }
#yutoriApp .yt-choice.is-selected .yt-dot { border-color: var(--sel-line); }
#yutoriApp .yt-choice.is-selected .yt-dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--sel-line); }
#yutoriApp .yt-hint { text-align: center; font-size: 12.5px; color: var(--ink-soft); }

/* --- 診断中 --- */
#yutoriApp .yt-loading { align-items: center; padding: 70px 0 80px; gap: 20px; }
#yutoriApp .yt-loading p { font-weight: 700; font-size: 15px; color: var(--teal-deep); }
#yutoriApp .yt-breath { width: 64px; height: 64px; border-radius: 50%; background: var(--aqua); border: 1.5px solid #bfeef0;
  display: grid; place-items: center; animation: ytBreath 1.3s ease-in-out infinite; }
#yutoriApp .yt-breath svg { width: 40px; height: 40px; }
@keyframes ytBreath { 0%,100% { transform: scale(.9); } 50% { transform: scale(1.08); } }

/* --- 結果 --- */
#yutoriApp .yt-result { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  margin: -22px -22px 0; padding: 26px 22px 20px;
  background: var(--type-bg, #f3f9fe); }
#yutoriApp .yt-result-lead { font-family: var(--serif); font-weight: 700; font-size: 15px; color: #222; letter-spacing: .08em; }
#yutoriApp .yt-type { font-family: var(--serif); font-weight: 700; font-size: clamp(22px, 6.6vw, 28px); line-height: 1.5; color: var(--navy);
  letter-spacing: .03em; word-break: keep-all; overflow-wrap: anywhere; }
#yutoriApp .yt-result .yt-bubble { margin-top: 8px; text-align: left; white-space: pre-line; max-width: 100%; align-self: stretch; width: auto;
  padding: 14px 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(31, 59, 91, .06); }
/* 「さらに」のアイキャッチ吹き出し（黄色マーカー色×ネイビー明朝、下向きのしっぽ） */
#yutoriApp .yt-more { display: flex; justify-content: center; margin-bottom: -10px; }
#yutoriApp .yt-more span { position: relative; display: inline-block; padding: 8px 26px; border-radius: 999px;
  background: var(--marker); color: var(--navy); font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: .12em;
  box-shadow: 0 6px 16px rgba(30, 63, 158, .14); animation: ytPop 1.6s ease-in-out infinite; }
#yutoriApp .yt-more span::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px;
  border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 10px solid var(--marker); }
@keyframes ytPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
#yutoriApp .yt-locked { display: flex; flex-direction: column; gap: 8px; }
#yutoriApp .yt-nb { display: inline-block; white-space: nowrap; }
#yutoriApp .yt-locked .yt-sec { margin-bottom: 6px; }
#yutoriApp .yt-lock { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; font-size: 14px; line-height: 1.65;
  background: #f7fdfe; border: 1px solid #d3eef1; border-radius: 12px; }
#yutoriApp .yt-lock svg { flex: none; margin-top: 4px; }
#yutoriApp .yt-lock span { white-space: pre-line; }
#yutoriApp .yt-arrow { text-align: center; font-weight: 700; font-size: 14px; color: var(--teal-deep); }
#yutoriApp .yt-arrow::after { content: ""; display: block; width: 9px; height: 9px; margin: 6px auto 0;
  border-right: 2.5px solid var(--teal); border-bottom: 2.5px solid var(--teal); transform: rotate(45deg); animation: ytBob 1.4s ease-in-out infinite; }
@keyframes ytBob { 0%,100% { transform: translateY(0) rotate(45deg); } 50% { transform: translateY(5px) rotate(45deg); } }
#yutoriApp .yt-retry { align-self: center; background: none; border: 0; padding: 4px 8px; font-size: 12.5px; color: var(--ink-soft); text-decoration: underline; }

/* --- リザスト純正の登録欄・送信ボタン（色は元LPのまま。幅と角だけ整える） --- */
.yt-on.yt-stage-register .page2-form-customer-block { margin-top: 22px; }
.yt-on .page2-form-customer-block input[type=text],
.yt-on .page2-form-customer-block input[type=email] { box-sizing: border-box; max-width: 100%; font-size: 16px; padding: 12px 14px;
  border: 1.5px solid #dfe6ee; border-radius: 12px; background: #fff; color: #243447; }
.yt-on .page2-form-customer-block input[type=text]:focus { outline: 3px solid rgba(59, 130, 196, .25); border-color: var(--sel-line); }
.yt-on #button { margin-top: 22px; text-align: center; }
.yt-on #button a.button { display: block; width: 100%; box-sizing: border-box; padding: 16px 18px; border-radius: 50px;
  font-family: var(--sans); font-weight: 700; font-size: 18px; line-height: 1.4; letter-spacing: .04em; text-decoration: none;
  box-shadow: 0 8px 20px rgba(0, 109, 121, .28); }

@media (max-width: 480px) {
  .yt-on { padding: 20px 18px 26px; }
  #yutoriApp .yt-mv, #yutoriApp .yt-result { margin-left: -18px; margin-right: -18px; margin-top: -20px; padding-left: 18px; padding-right: 18px; }
  #yutoriApp .yt-art { width: calc(100% + 36px); margin-left: -18px; margin-right: -18px; }
  #yutoriApp .yt-mv-copy .l2 { font-size: 36px; }
  #yutoriApp .yt-mv-name { font-size: 17px; letter-spacing: .26em; }
  #yutoriApp .yt-mv-row { gap: 12px; }
  #yutoriApp .yt-mv-sub { font-size: 14px; padding-left: 12px; }

          '<p class="yt-mv-sub">3つの「心のタイプ」で<br>もっと<span class="yt-mk">ラク</span>に生きる自分へ</p></div></section>'
        : '';
      app.innerHTML = '<div class="yt-screen">' + mv +
        '<section class="yt-hero">' + (hero ? '' : '<h2 class="yt-title">' + esc(I.title) + '</h2>') + '<div class="yt-chips">' +
        I.chips.map(function (c, i) { return '<span class="yt-chip' + (i === 0 ? ' is-free' : '') + '">' + esc(c) + '</span>'; }).join('') +
        '</div>' + (I.lede ? '<p class="yt-lede">' + esc(I.lede) + '</p>' : '') + '</section>' +
        '<section class="yt-voices"><p class="yt-sec">' + esc(I.voicesTitle) + '</p>' +
        I.voices.map(function (v, i) { return '<div class="yt-bubble' + (i % 2 ? ' is-r' : '') + '">' + esc(v) + '</div>'; }).join('') +
        '<p class="yt-note">' + esc(I.voicesNote) + '</p></section>' +
        '<section><p class="yt-sec">' + esc(I.typesTitle) + '</p>' +
        (I.typesImage
          ? '<div class="yt-types-img"><img src="' + esc(CONFIG.imgBase + I.typesImage) + '" alt="' + esc(I.typesImageAlt || '') + '" width="1200" height="479" decoding="async"></div>'
          : '<div class="yt-types">' + CONFIG.types.map(function (t, i) {
          var blur = i === I.blurIndex;
          return '<div class="yt-tcard' + (blur ? ' is-blur' : '') + '" style="--type-bg:' + esc(t.bg) + '">' + typeThumb(t, blur) +
            '<b>' + (blur ? '？？？さん' : t.nick.replace('<wbr>', '<br>')) + '</b>' +
            (I.showTypeNameOnCards ? '<small>' + (blur ? 'ひみつのタイプ' : t.name.replace('<wbr>', '<br>')) + '</small>' : '') + '</div>';
        }).join('') + '</div>') +
        '<p class="yt-types-note">' + esc(I.typesNote) + '</p></section>' +
        '<section class="yt-gift"><div class="yt-gift-ico">' + ART.gift + '</div><div><b>' + esc(I.giftTitle) + '</b><span>' + esc(I.giftText) + '</span></div></section>' +
        '<section class="yt-who"><div class="yt-avatar">' + ART.leaf + '</div><div><b>' + esc(I.whoName) + '</b><p>' + esc(I.whoText) + '</p></div></section>' +
        '<div class="yt-cta"><button type="button" class="yt-btn" id="ytStart">' + esc(I.cta) + '</button><small>' + esc(I.ctaNote) + '</small></div>' +
        '</div>';
      if (I.avatarUrl) {
        var img = new Image();
        img.alt = 'あまのさわ';
        img.onload = function () { var av = app.querySelector('.yt-avatar'); if (av) { av.textContent = ''; av.appendChild(img); } };
        img.src = I.avatarUrl;
      }
      preloadArt();
      readTrack();
      app.querySelector('#ytStart').addEventListener('click', function () { px('DiagnosisStart', {}, true); showQuestion(0); });
    }

    function showQuestion(i) {
      setRegister(false);
      preloadArt();
      var q = questions[i], total = questions.length, steps = '';
      for (var s = 0; s < total; s++) steps += '<i class="' + (s < i ? 'is-done' : s === i ? 'is-now' : '') + '"></i>';
      app.innerHTML = '<div class="yt-screen">' +
        '<div class="yt-qbar"><button type="button" class="yt-back" aria-label="前に戻る"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<div class="yt-steps" aria-hidden="true">' + steps + '</div><span class="yt-count">' + (i + 1) + ' / ' + total + '</span></div>' +
        '<div class="yt-qcard"><div class="yt-q"><span class="yt-qno">Q' + (i + 1) + '</span><p class="yt-qtext">' + esc(q.text) + '</p></div>' +
        '<div class="yt-choices">' +
        q.choices.map(function (c, j) {
          return '<button type="button" class="yt-choice' + (answers[i] === j ? ' is-selected' : '') + '" data-j="' + j +
            '"><span class="yt-dot"></span><span>' + esc(c.text) + '</span></button>';
        }).join('') +
        '</div></div><p class="yt-hint">' + esc(CONFIG.hint) + '</p></div>';

      var locked = false;
      Array.prototype.forEach.call(app.querySelectorAll('.yt-choice'), function (btn) {
        btn.addEventListener('click', function () {
          if (locked) return;
          locked = true;
          var j = +btn.getAttribute('data-j');
          answers[i] = j;
          save();
          var radio = q.choices[j].radio;
          if (radio) {
            radio.checked = true;
            radio.dispatchEvent(new Event('change', { bubbles: true }));
          }
          Array.prototype.forEach.call(app.querySelectorAll('.yt-choice'), function (b) { b.classList.remove('is-selected'); });
          btn.classList.add('is-selected');
          setTimeout(function () {
            if (i + 1 < total) showQuestion(i + 1); else showResult(true);
          }, 320);
        });
      });
      app.querySelector('.yt-back').addEventListener('click', function () {
        if (i > 0) showQuestion(i - 1); else showIntro();
        scrollToApp();
      });
      scrollToApp();
    }

    function showResult(withLoading) {
      if (withLoading) {
        setRegister(false);
        app.innerHTML = '<div class="yt-screen yt-loading"><div class="yt-breath">' + ART.leaf + '</div><p>' + esc(CONFIG.loadingText) + '</p></div>';
        scrollToApp();
        setTimeout(function () { showResult(false); }, 1400);
        return;
      }
      var total = answers.reduce(function (sum, j, i) { return sum + CONFIG.scores[i][j]; }, 0);
      var type = CONFIG.types.filter(function (t) { return total >= t.min; })[0];
      var lock = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#006d79" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
      app.innerHTML = '<div class="yt-screen">' +
        '<section class="yt-result" style="--type-bg:' + esc(type.bg) + '"><div class="yt-chips"><span class="yt-chip is-free">診断結果</span></div>' +
        '<p class="yt-result-lead">' + esc(CONFIG.resultLead) + '</p>' +
        '<div class="yt-art">' + typeImg(type) + '</div>' + // タイプ名・愛称はイラスト内に描かれている（テキスト見出しは alt に集約）
        '<div class="yt-bubble">' + esc(type.hook) + '</div></section>' +
        '<div class="yt-more"><span>' + esc(CONFIG.moreText) + '</span></div>' +
        '<section class="yt-locked"><p class="yt-sec">' + esc(CONFIG.lockedTitle) + (CONFIG.lockedTitleTag ? '<span class="yt-nb">' + esc(CONFIG.lockedTitleTag) + '</span>' : '') + '</p>' +
        CONFIG.lockedItems.map(function (t) { return '<div class="yt-lock">' + lock + '<span>' + esc(t) + '</span></div>'; }).join('') +
        '</section>' +
        (standalone
          ? '<div class="yt-cta is-static"><a class="yt-btn" href="' + esc(withTrackId(type, type.registerUrl)) + '">' + esc(CONFIG.registerCta) + '</a><small>' + esc(CONFIG.registerNote) + '</small></div>'
          : '<p class="yt-arrow">' + esc(CONFIG.arrowText) + '</p>') +
        '<button type="button" class="yt-retry">もう一度診断する</button></div>';
      setRegister(true);
      var typeLabel = type.nick.replace(/<wbr>/g, '');
      if (!resultTracked) { resultTracked = true; px('DiagnosisComplete', { content_name: typeLabel }, true); }
      var reg = app.querySelector('.yt-cta.is-static .yt-btn');
      if (reg) {
        reg.addEventListener('click', function () { px('Lead', { content_name: typeLabel, content_category: 'inline' }); });
        // 画面下に登録ボタンを常時表示（2026-09-26 さわさんOK）。本来のボタンが画面に入っている間は隠す。app.innerHTML の差し替えで自動的に消える
        var bar = document.createElement('div');
        bar.className = 'yt-sticky';
        bar.innerHTML = '<a class="yt-btn" href="' + esc(reg.getAttribute('href')) + '">' + esc(CONFIG.registerCta) + '</a>';
        app.appendChild(bar);
        app.querySelector('.yt-screen').classList.add('has-sticky');
        bar.querySelector('a').addEventListener('click', function () { px('Lead', { content_name: typeLabel, content_category: 'sticky' }); });
        var syncBar = function () {
          if (!bar.isConnected) { window.removeEventListener('scroll', syncBar); window.removeEventListener('resize', syncBar); return; }
          var r = reg.getBoundingClientRect();
          bar.classList.toggle('is-hidden', r.top < window.innerHeight && r.bottom > 0);
        };
        window.addEventListener('scroll', syncBar, { passive: true });
        window.addEventListener('resize', syncBar);
        syncBar();
      }
      app.querySelector('.yt-retry').addEventListener('click', function () {
        answers = answers.map(function () { return null; });
        save();
        questions.forEach(function (q) { q.choices.forEach(function (c) { if (c.radio) c.radio.checked = false; }); });
        showQuestion(0);
      });
      scrollToApp();
    }

    function scrollToApp() {
      var rect = form.getBoundingClientRect();
      if (rect.top < 0 || rect.top > 140) {
        var top = rect.top + window.pageYOffset - 80; // 固定ヘッダー分
        try { window.scrollTo({ top: top, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, top); }
      }
    }

    function save() {
      try { sessionStorage.setItem(CONFIG.storageKey, JSON.stringify(answers)); } catch (e) {}
    }
  }

  // 送信エラーでページが再表示された時に結果画面へ戻すための復元
  function restore(n) {
    var empty = []; for (var i = 0; i < n; i++) empty.push(null);
    try {
      var a = JSON.parse(sessionStorage.getItem(CONFIG.storageKey) || 'null');
      if (Array.isArray(a) && a.length === n && a.every(function (v, i) {
        return v === null || (typeof v === 'number' && v >= 0 && v < CONFIG.scores[i].length);
      })) return a;
    } catch (e) {}
    return empty;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
