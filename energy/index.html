<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エネルギー消耗タイプ診断｜あまのさわ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8793a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;700&family=Noto+Serif+JP:wght@700&family=Yusei+Magic&display=swap">
<style>
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#fff1e4 0,#fffaf5 320px,#fff 100%);color:#4a3427;font-family:"M PLUS 1","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
.site-main{padding:20px 12px 8px}
.site-foot{text-align:center;font-size:12px;color:#7f6656;padding:8px 16px 32px;line-height:1.8}
</style>
<style>
/* ===== エネルギー消耗タイプ診断 アプリ版（モックアップ 2026-10-01） =====
   心のゆとり診断アプリ（2026-09-17_yutori-diagnosis-app/src/yutori-app.css）をベースに、
   元LP（page/fast_scoring/3219）のメインビジュアル（アプリコット〜オレンジのグラデ＋金の光、オレンジ明朝）に色を寄せた版。
   単体ページ専用（リザスト埋め込み用の指定は外した） */

#energy-root {
  --paper: #ffffff;
  --paper-2: #fff8f1;
  --ink: #4a3427;
  --ink-soft: #7f6656;
  --line: #f1e1d2;
  --teal: #e8793a;
  --teal-deep: #b9561f;
  --aqua: #fff0e2;        /* 設問ヘッダー・心の声 */
  --sel-bg: #fff6ea;
  --sel-line: #e8793a;
  --navy: #c45a1c;        /* メインビジュアルの明朝見出し */
  --marker: #ffe08a;      /* メインビジュアルの黄色マーカー */
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --hand: "Yusei Magic", "Noto Serif JP", "Hiragino Mincho ProN", serif; /* 手書き風（カードの愛称） */

  display: block; box-sizing: border-box; width: 100%; max-width: 430px; margin: 0 auto 40px;
  padding: 22px 22px 30px; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 22px rgba(110, 62, 30, .08);
  overflow: clip; /* ヒーローの角を丸める。clip は sticky を壊さない */
  font-family: var(--sans); font-size: 15px; line-height: 1.8; text-align: left;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}

/* --- ステージ制御（JSが form にクラスを付けた時だけ効く＝JS無効なら従来表示のまま） --- */
#energy-root #fast_scoring_items { display: none !important; }
#energy-root:not(.en-stage-register) .page2-form-customer-block,
#energy-root:not(.en-stage-register) #button,
#energy-root:not(.en-stage-register) #errors { display: none !important; }
body.en-immersive .freetextSec { display: none !important; }

#energyApp, #energyApp *, #energyApp *::before, #energyApp *::after { box-sizing: border-box; }
#energyApp p { margin: 0; }
#energyApp button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#energyApp .en-screen { display: flex; flex-direction: column; gap: 26px; animation: enIn .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes enIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#energyApp mark, #energyApp .en-mk { color: inherit; padding: 0 .08em;
  background: linear-gradient(transparent 60%, var(--marker) 60%, var(--marker) 92%, transparent 92%); }

/* --- 共通パーツ --- */
#energyApp .en-sec { font-weight: 700; font-size: 15px; line-height: 1.5; color: #4a3427; margin-bottom: 12px;
  padding: 3px 0 5px 10px; border-left: 4px solid var(--teal-deep); border-bottom: 2px solid var(--teal-deep); }
#energyApp .en-chips { display: flex; gap: 8px; flex-wrap: wrap; }
#energyApp .en-chip { font-size: 11.5px; letter-spacing: .06em; padding: 4px 11px; border-radius: 999px; line-height: 1.6;
  background: #fff; color: var(--teal-deep); border: 1px solid #f4cfb4; }
#energyApp .en-chip.is-free { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700; }
#energyApp .en-bubble { background: var(--aqua); border-radius: 18px 18px 18px 4px; padding: 10px 14px;
  font-size: 14.5px; line-height: 1.7; width: fit-content; max-width: 92%; white-space: pre-line; }
#energyApp .en-bubble.is-r { align-self: flex-end; border-radius: 18px 18px 4px 18px; background: var(--sel-bg); }
#energyApp .en-art img, #energyApp .en-gift-ico svg { display: block; width: 100%; height: 100%; object-fit: cover; }
/* 入り口カードの丸窓：イラストの一部（顔まわり）をチラ見せ。固定サイズ＋背景画像＝古いブラウザでも崩れない */
#energyApp .en-thumb { position: relative; width: 78px; height: 78px; border-radius: 50%; overflow: hidden; margin-top: 4px;
  background: #fff; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(110, 62, 30, .14); }
#energyApp .en-thumb-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background-repeat: no-repeat; background-size: 250% auto; background-color: var(--type-bg, #fff4ea); }
#energyApp .is-blur .en-thumb-img { filter: blur(4px); transform: scale(1.15); opacity: .85; }
#energyApp .en-thumb-q { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1; color: var(--navy); text-shadow: 0 0 10px #fff, 0 0 4px #fff; }
/* 結果のイラスト：カードの端まで画面いっぱいに（正方形・枠なし）。周りの背景はイラストの地色（--type-bg）に合わせて一体化 */
#energyApp .en-art { width: calc(100% + 44px); margin: 2px -22px 0; aspect-ratio: 1 / 1; background: var(--type-bg, #fff4ea); }
#energyApp .en-btn { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; border-radius: 50px; padding: 16px 18px;
  background: linear-gradient(358deg, #f0894a, #d0581f); color: #fff; font-weight: 700; font-size: 18px; line-height: 1.4;
  box-shadow: 0 8px 20px rgba(185, 86, 31, .28); letter-spacing: .04em; transition: transform .12s ease, filter .12s ease; }
#energyApp .en-btn:hover { filter: brightness(1.08); }
#energyApp .en-btn:active { transform: scale(.985); }
#energyApp button:focus-visible { outline: 3px solid rgba(232, 121, 58, .5); outline-offset: 3px; }

/* --- 入り口：メインビジュアル風ヒーロー（ページに本物のメインビジュアルがある時は出さない） --- */
#energyApp .en-mv { margin: -22px -22px 0; padding: 30px 22px 24px; font-family: var(--serif); color: #7a5236; text-align: center;
  background:
    radial-gradient(circle at 50% 8%, rgba(255, 255, 240, .95), transparent 34%),
    radial-gradient(circle at 88% 70%, rgba(255, 236, 190, .8), transparent 30%),
    radial-gradient(circle at 10% 90%, rgba(255, 255, 255, .55), transparent 36%),
    linear-gradient(160deg, #fff3dc 0%, #ffd9b0 48%, #f6a879 100%); }
#energyApp .en-mv-copy { font-weight: 700; line-height: 1.5; letter-spacing: .02em; }
#energyApp .en-mv-copy .l1 { display: block; font-size: 23px; color: var(--navy); }
#energyApp .en-mv-copy .l2 { display: block; font-size: 40px; line-height: 1.3; color: var(--navy); }
#energyApp .en-mv-copy .l2 small { font-size: 22px; color: #4a3427; }
#energyApp .en-mv-copy .l3 { display: block; font-size: 22px; margin-top: 4px; }
#energyApp .en-mv-copy .l4 { display: block; font-size: 30px; color: var(--navy); letter-spacing: .06em; }
#energyApp .en-mv-name { margin-top: 14px; padding-top: 10px; border-top: 1.5px solid var(--navy);
  font-weight: 700; font-size: 19px; letter-spacing: .32em; color: var(--navy); white-space: nowrap; }
#energyApp .en-mv-row { margin-top: 14px; display: flex; align-items: center; gap: 14px; }
#energyApp .en-mv-badge { flex: none; width: 74px; height: 74px; border-radius: 50%; background: #fff; color: var(--navy);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; line-height: 1.15;
  box-shadow: 0 4px 14px rgba(196, 90, 28, .12); }
#energyApp .en-mv-badge b { font-size: 25px; line-height: 1.1; }
#energyApp .en-mv-sub { font-weight: 700; font-size: 15.5px; line-height: 1.6; color: var(--navy); padding-left: 14px; border-left: 1.5px solid var(--navy); }
#energyApp .en-title { font-family: var(--serif); font-weight: 700; font-size: 25px; line-height: 1.45; margin: 0; color: var(--navy);
  letter-spacing: .04em; border: 0; padding: 0; background: none; }

#energyApp .en-hero { display: flex; flex-direction: column; gap: 14px; }
#energyApp .en-lede { color: var(--ink); font-size: 14.5px; }
#energyApp .en-voices { display: flex; flex-direction: column; gap: 10px; }
#energyApp .en-voices .en-sec { margin-bottom: 4px; }
#energyApp .en-note { font-size: 13.5px; margin-top: 6px; }
#energyApp .en-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#energyApp .en-types-img img { display: block; width: 100%; height: auto; }
#energyApp .en-tcard { background: var(--type-bg, #fff); border: 1px solid rgba(255, 255, 255, .9); border-radius: 12px; padding: 8px 3px 10px;
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 3px 10px rgba(110, 62, 30, .06); }
#energyApp .en-tcard b { font-family: var(--hand); font-size: 15px; line-height: 1.3; font-weight: 400; color: var(--navy); letter-spacing: 0; white-space: nowrap; margin-top: 2px; }
#energyApp .en-tcard small { display: block; margin-top: -4px; font-size: 10.5px; line-height: 1.4; color: var(--ink-soft); }
#energyApp .en-tcard.is-blur b, #energyApp .en-tcard.is-blur small { color: transparent; text-shadow: 0 0 7px rgba(110, 62, 30, .55); }
#energyApp .en-types-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; white-space: pre-line; }
#energyApp .en-gift { display: flex; gap: 12px; align-items: flex-start; border: 1.5px dashed var(--teal); border-radius: 12px;
  padding: 12px 14px; background: #fffaf4; }
#energyApp .en-gift-ico { width: 46px; height: 46px; flex: none; }
#energyApp .en-gift b { font-size: 14px; display: block; color: var(--teal-deep); }
#energyApp .en-gift span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; display: block; white-space: pre-line; }
#energyApp .en-who { display: flex; gap: 12px; align-items: flex-start; }
#energyApp .en-avatar { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #f3faf6, #cfe6ee); border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(110, 62, 30, .15); display: grid; place-items: center; }
#energyApp .en-avatar svg { width: 36px; height: 36px; }
#energyApp .en-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
#energyApp .en-who b { font-family: var(--serif); font-size: 14.5px; display: block; color: #4a3427; }
#energyApp .en-who p { margin-top: 2px; font-size: 13px; color: var(--ink-soft); line-height: 1.7; white-space: pre-line; }
#energyApp .en-cta { position: sticky; bottom: 0; z-index: 2; margin-top: -8px; padding: 22px 0 12px;
  background: linear-gradient(transparent, var(--paper) 38%); }
#energyApp .en-cta.is-static { position: static; margin-top: 0; padding: 0; background: none; }
#energyApp .en-cta small { display: block; text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }

/* --- 質問：元LPの設問カード（水色ヘッダー＋選択肢）をそのまま1問ずつに --- */
#energyApp .en-qbar { display: flex; align-items: center; gap: 12px; }
#energyApp .en-back { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: #fff; color: var(--teal-deep); padding: 0; display: flex; align-items: center; justify-content: center; }
#energyApp .en-back svg { display: block; margin-left: -1px; /* 矢印の見た目の重心を円の中央に */ }
#energyApp .en-steps { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
#energyApp .en-steps i { height: 6px; border-radius: 99px; background: #f6e9df; transition: background .3s; }
#energyApp .en-steps i.is-done { background: #f3b48a; }
#energyApp .en-steps i.is-now { background: var(--teal); }
#energyApp .en-count { flex: none; font-size: 12.5px; font-weight: 700; color: var(--teal-deep); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
#energyApp .en-qcard { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  box-shadow: 0 6px 22px rgba(110, 62, 30, .08); margin: 0 -6px; }
#energyApp .en-q { background: var(--aqua); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 4px; min-height: 6.4em; }
#energyApp .en-qno { font-weight: 700; font-size: 12px; color: var(--teal-deep); letter-spacing: .14em; }
#energyApp .en-qtext { font-weight: 700; font-size: 18px; line-height: 1.55; color: var(--ink); }
#energyApp .en-choices { display: flex; flex-direction: column; gap: 12px; padding: 18px 14px 18px; }
#energyApp .en-choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 15px 14px;
  font-size: 15.5px; line-height: 1.55; color: #4a3427; background: #fffcf8; border: 1.5px solid #eddccd; border-radius: 12px;
  transition: background .15s, border-color .15s, transform .1s; }
#energyApp .en-choice:hover { border-color: #f0b88f; }
#energyApp .en-choice:active { transform: scale(.985); }
#energyApp .en-dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #b49a88; background: #fff; position: relative; }
#energyApp .en-choice.is-selected { background: var(--sel-bg); border-color: var(--sel-line); }
#energyApp .en-choice.is-selected .en-dot { border-color: var(--sel-line); }
#energyApp .en-choice.is-selected .en-dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--sel-line); }
#energyApp .en-hint { text-align: center; font-size: 12.5px; color: var(--ink-soft); }

/* --- 診断中 --- */
#energyApp .en-loading { align-items: center; padding: 70px 0 80px; gap: 20px; }
#energyApp .en-loading p { font-weight: 700; font-size: 15px; color: var(--teal-deep); }
#energyApp .en-breath { width: 64px; height: 64px; border-radius: 50%; background: var(--aqua); border: 1.5px solid #f6d6bd;
  display: grid; place-items: center; animation: enBreath 1.3s ease-in-out infinite; }
#energyApp .en-breath svg { width: 40px; height: 40px; }
@keyframes enBreath { 0%,100% { transform: scale(.9); } 50% { transform: scale(1.08); } }

/* --- 結果 --- */
#energyApp .en-result { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  margin: -22px -22px 0; padding: 26px 22px 20px;
  background: var(--type-bg, #fff4ea); }
#energyApp .en-result-lead { font-family: var(--serif); font-weight: 700; font-size: 15px; color: #4a3427; letter-spacing: .08em; }
#energyApp .en-type { font-family: var(--serif); font-weight: 700; font-size: clamp(22px, 6.6vw, 28px); line-height: 1.5; color: var(--navy);
  letter-spacing: .03em; word-break: keep-all; overflow-wrap: anywhere; }
#energyApp .en-result .en-bubble { margin-top: 8px; text-align: left; white-space: pre-line; max-width: 100%; align-self: stretch; width: auto;
  padding: 14px 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(110, 62, 30, .06); }
/* 「さらに」のアイキャッチ吹き出し（黄色マーカー色×ネイビー明朝、下向きのしっぽ） */
#energyApp .en-more { display: flex; justify-content: center; margin-bottom: -10px; }
#energyApp .en-more span { position: relative; display: inline-block; padding: 8px 26px; border-radius: 999px;
  background: var(--marker); color: var(--navy); font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: .12em;
  box-shadow: 0 6px 16px rgba(196, 90, 28, .14); animation: enPop 1.6s ease-in-out infinite; }
#energyApp .en-more span::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px;
  border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 10px solid var(--marker); }
@keyframes enPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
#energyApp .en-locked { display: flex; flex-direction: column; gap: 8px; }
#energyApp .en-nb { display: inline-block; white-space: nowrap; }
#energyApp .en-locked .en-sec { margin-bottom: 6px; }
#energyApp .en-lock { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; font-size: 14px; line-height: 1.65;
  background: #fffaf4; border: 1px solid #f5dcc8; border-radius: 12px; }
#energyApp .en-lock svg { flex: none; margin-top: 4px; }
#energyApp .en-lock span { white-space: pre-line; }
#energyApp .en-arrow { text-align: center; font-weight: 700; font-size: 14px; color: var(--teal-deep); }
#energyApp .en-arrow::after { content: ""; display: block; width: 9px; height: 9px; margin: 6px auto 0;
  border-right: 2.5px solid var(--teal); border-bottom: 2.5px solid var(--teal); transform: rotate(45deg); animation: enBob 1.4s ease-in-out infinite; }
@keyframes enBob { 0%,100% { transform: translateY(0) rotate(45deg); } 50% { transform: translateY(5px) rotate(45deg); } }
#energyApp .en-retry { align-self: center; background: none; border: 0; padding: 4px 8px; font-size: 12.5px; color: var(--ink-soft); text-decoration: underline; }

@media (max-width: 480px) {
  #energy-root { padding: 20px 18px 26px; }
  #energyApp .en-mv, #energyApp .en-result { margin-left: -18px; margin-right: -18px; margin-top: -20px; padding-left: 18px; padding-right: 18px; }
  #energyApp .en-art { width: calc(100% + 36px); margin-left: -18px; margin-right: -18px; }
  #energyApp .en-mv-copy .l2 { font-size: 36px; }
  #energyApp .en-mv-name { font-size: 17px; letter-spacing: .26em; }
  #energyApp .en-mv-row { gap: 12px; }
  #energyApp .en-mv-sub { font-size: 14px; padding-left: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #energyApp .en-screen, #energyApp .en-breath, #energyApp .en-arrow::after, #energyApp .en-more span { animation: none; }
  #energyApp .en-btn, #energyApp .en-choice, #energyApp .en-steps i { transition: none; }
}

/* 結果画面：画面下に常時表示する登録ボタン（2026-09-26）。本来のボタンが見えている間は .is-hidden で隠れる */
#energyApp .en-sticky { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: 0 -4px 16px rgba(110, 62, 30, .12); transition: transform .25s ease, opacity .25s ease; }
#energyApp .en-sticky .en-btn { max-width: 430px; margin: 0 auto; }
#energyApp .en-sticky.is-hidden { transform: translateY(110%); opacity: 0; pointer-events: none; }
#energyApp .en-screen.has-sticky { padding-bottom: 84px; }

/* ===== ここからエネルギー診断で足したもの ===== */
/* ヒーロー（3219のメインビジュアルの文言・配置を再現。本物の画像に差し替える時は CONFIG.intro.heroImage） */
#energyApp .en-mv-kicker { display: inline-block; font-weight: 700; font-size: 17px; letter-spacing: .08em; color: #7a5236;
  padding: 0 4px 6px; border-bottom: 1.5px solid rgba(122, 82, 54, .45); }
#energyApp .en-mv-title { margin-top: 12px; font-weight: 700; font-size: 36px; line-height: 1.32; letter-spacing: .06em; color: #e0662a;
  text-shadow: 0 2px 0 rgba(255, 255, 255, .7), 0 0 18px rgba(255, 247, 225, .9); }
#energyApp .en-mv-orn { display: block; width: 150px; height: 12px; margin: 10px auto 8px; }
#energyApp .en-mv-sub2 { font-weight: 700; font-size: 15px; letter-spacing: .04em; color: #7a5236; }
#energyApp .en-mv-img { margin: -22px -22px 0; }
#energyApp .en-mv-img img { display: block; width: 100%; height: auto; }

/* 「それ！」の気づきボックスと、解説（逆効果 → タイプを知らないだけ） */
#energyApp .en-aha { background: #fff; border: 2px solid var(--teal); border-radius: 16px; padding: 14px 16px; text-align: center;
  font-size: 15px; line-height: 1.8; white-space: pre-line; box-shadow: 0 6px 16px rgba(185, 86, 31, .1); }
#energyApp .en-aha b { color: var(--navy); font-family: var(--serif); font-size: 17px; }
#energyApp .en-explain { display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; line-height: 1.85; }
#energyApp .en-explain p { white-space: pre-line; }
#energyApp .en-explain ul { margin: 0; padding: 10px 14px; list-style: none; background: var(--paper-2); border-radius: 12px; }
#energyApp .en-explain li::before { content: "・"; color: var(--teal-deep); }

  var ART = {
    // 仮枠に描くシルエット（人物＋光）。type ごとの色は currentColor
    figure: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false" fill="currentColor"><circle cx="60" cy="40" r="17"/><path d="M28 104c2-22 15-36 32-36s30 14 32 36z"/><path d="M98 18l2.6 7.4L108 28l-7.4 2.6L98 38l-2.6-7.4L88 28l7.4-2.6z" opacity=".7"/><path d="M22 44l1.8 5.2L29 51l-5.2 1.8L22 58l-1.8-5.2L15 51l5.2-1.8z" opacity=".5"/></svg>',
    sun: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="11" fill="#f5a35f"/><g stroke="#f0b26f" stroke-width="3" stroke-linecap="round"><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M13.6 50.4l5.7-5.7M44.7 19.3l5.7-5.7"/></g></svg>',
    orn: '<svg class="en-mv-orn" viewBox="0 0 150 12" aria-hidden="true" focusable="false"><path d="M2 6h56M92 6h56" stroke="#d98a52" stroke-width="1.2"/><circle cx="75" cy="6" r="4.5" fill="none" stroke="#e0662a" stroke-width="1.4"/><circle cx="64" cy="6" r="1.8" fill="#e0662a"/><circle cx="86" cy="6" r="1.8" fill="#e0662a"/></svg>'
  };

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  }

  ready(function () {
    var root = document.getElementById('energy-root');
    if (!root || document.getElementById('energyApp')) return;
    if (CONFIG.fontsHref && !document.querySelector('link[data-en-fonts]')) {
      var link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = CONFIG.fontsHref; link.setAttribute('data-en-fonts', '');
      document.head.appendChild(link);
    }
    var questions = CONFIG.questions, total = questions.length;
    var answers = restore(total);
    var app = document.createElement('div');
    app.id = 'energyApp';
    root.innerHTML = ''; root.appendChild(app);

    var answered = answers.filter(function (a) { return a !== null; }).length;
    if (answered === total) showResult(judge(), false);
    else if (answered > 0) showQuestion(answers.indexOf(null));
    else showIntro();

    // プレビュー（モックアップ確認用）から4タイプの結果を直接開けるように
    window.EnergyApp = {
      showType: function (i) { showResult(CONFIG.types[i], false); },
      restart: function () { answers = answers.map(function () { return null; }); save(); showIntro(); scrollToApp(); }
    };

    function judge() {
      var s = answers.reduce(function (acc, j, i) { var p = CONFIG.scores[i][j]; return [acc[0] + p[0], acc[1] + p[1]]; }, [0, 0]);
      var hss = s[0] >= CONFIG.threshold.hss, hsp = s[1] >= CONFIG.threshold.hsp;
      return CONFIG.types.filter(function (t) { return t.hss === hss && t.hsp === hsp; })[0];
    }

    function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
    function plain(s) { return s.replace(/<wbr>/g, ''); }
    function placeholder(t, cls, withTag, blur) {
      return '<div class="en-ph ' + cls + '" style="color:' + esc(darken(t.bg)) + '">' + ART.figure +
        (blur ? '<span class="en-ph-q" aria-hidden="true">?</span>' : '') +
        (withTag ? '<span class="en-ph-tag">' + esc(CONFIG.placeholderText) + '</span>' : '') + '</div>';
    }
    // プレゼントの解説本を「本」の装丁で（表紙は今の画像そのまま。厚み＝ページの小口＋背の折り目）
    function book3d(t, w) {
      return '<span class="en-book3d" style="--bw:' + w + 'px"><span class="en-book3d-in">' +
        '<img src="' + esc(CONFIG.imgBase + t.book) + '" alt="' + esc(t.bookTitle) + '" decoding="async"></span></span>';
    }
    function typeArt(t) {
      return t.img
        ? '<img src="' + esc(CONFIG.imgBase + t.img) + '" alt="' + esc(plain(t.name) + '（' + t.label + '）') + '" width="714" height="535" decoding="async">'
        : placeholder(t, '', true, false);
    }

    function showIntro() {
      var I = CONFIG.intro;
      var hero = I.heroImage
        ? '<section class="en-mv-img"><img src="' + esc(CONFIG.imgBase + I.heroImage) + '" alt="' + esc(I.kicker + ' ' + I.title.replace(/\n/g, '')) + '"></section>'
        : '<section class="en-mv"><p class="en-mv-kicker">' + esc(I.kicker) + '</p><p class="en-mv-title">' + nl(I.title) + '</p>' + ART.orn +
          '<p class="en-mv-sub2">' + esc(I.sub) + '</p></section>';
      app.innerHTML = '<div class="en-screen">' + hero +
        '<section class="en-hero"><div class="en-chips">' +
        I.chips.map(function (c, i) { return '<span class="en-chip' + (i === 0 ? ' is-free' : '') + '">' + esc(c) + '</span>'; }).join('') + '</div></section>' +
        '<section class="en-voices"><p class="en-sec">' + esc(I.voicesTitle) + '</p>' +
        I.voices.map(function (v, i) { return '<div class="en-bubble' + (i % 2 ? ' is-r' : '') + '">' + esc(v) + '</div>'; }).join('') +
        '</section>' +
        '<section class="en-explain"><p>' + esc(I.voicesAfter) + '</p></section>' +
        '<div class="en-aha">' + I.aha + '</div>' + // aha は <b> を含む固定文（CONFIG内）なのでエスケープしない
        '<section class="en-explain"><p>' + esc(I.explainLead) + '</p><ul>' + I.explainList.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
        '<p>' + esc(I.explainMid) + '</p><p class="en-big">' + esc(I.explainBig) + '</p><p>' + esc(I.explainTail) + '</p>' +
        '<div class="en-conc"><p>' + esc(I.conc) + '</p><p class="en-big">' + esc(I.concBig) + '</p></div></section>' +
        '<section><p class="en-sec">' + esc(I.typesTitle) + '</p><div class="en-types">' +
        CONFIG.types.map(function (t, i) {
          var blur = [].concat(I.blurIndex).indexOf(i) >= 0;
          return '<div class="en-tcard' + (blur ? ' is-blur' : '') + '" style="--type-bg:' + esc(t.bg) + '">' +
            (t.face ? '<div class="en-face"><div class="en-face-img" style="background-image:url(' + esc(CONFIG.imgBase + t.face) + ')"></div>' +
              (blur ? '<span class="en-ph-q" aria-hidden="true">?</span>' : '') + '</div>' : placeholder(t, 'en-ph-dot', false, blur)) +
            '<b>' + (blur ? '？？？タイプ' : t.name.replace('<wbr>', '<br>')) + '</b></div>';
        }).join('') + '</div><p class="en-types-note">' + esc(I.typesNote) + '</p></section>' +
        '<section class="en-locked"><p class="en-sec">' + esc(I.learnTitle) + '</p>' +
        I.learnList.map(function (x) { return '<div class="en-lock">' + ART.sun.replace('<svg ', '<svg width="18" height="18" ') + '<span>' + esc(x) + '</span></div>'; }).join('') +
        '<p class="en-note">' + esc(I.learnNote) + '</p></section>' +
        '<section class="en-gift" style="flex-direction:column;align-items:stretch;text-align:center"><b>' + esc(I.giftTitle) + '</b>' +
        '<div class="en-books">' + CONFIG.types.map(function (t) { return book3d(t, 66); }).join('') + '</div>' +
        '<span>' + esc(I.giftText) + '</span></section>' +
        '<section class="en-who"><div class="en-avatar">' + ART.sun + '</div><div><b>' + esc(I.whoName) + '</b><p>' + esc(I.whoText) + '</p></div></section>' +
        '<div class="en-cta"><button type="button" class="en-btn" id="enStart">' + esc(I.cta) + '</button><small>' + esc(I.ctaNote) + '</small></div>' +
        '</div>';
      if (I.avatarUrl) {
        var img = new Image();
        img.alt = 'あまのさわ';
        img.onload = function () { var av = app.querySelector('.en-avatar'); if (av) { av.textContent = ''; av.appendChild(img); } };
        img.src = /^https?:/.test(I.avatarUrl) ? I.avatarUrl : CONFIG.imgBase + I.avatarUrl;
      }
      app.querySelector('#enStart').addEventListener('click', function () { showQuestion(0); });
    }

    function showQuestion(i) {
      var q = questions[i], steps = '';
      for (var s = 0; s < total; s++) steps += '<i class="' + (s < i ? 'is-done' : s === i ? 'is-now' : '') + '"></i>';
      app.innerHTML = '<div class="en-screen">' +
        '<div class="en-qbar"><button type="button" class="en-back" aria-label="前に戻る"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<div class="en-steps" aria-hidden="true">' + steps + '</div><span class="en-count">' + (i + 1) + ' / ' + total + '</span></div>' +
        '<div class="en-qcard"><div class="en-q"><span class="en-qno">Q' + (i + 1) + '</span><p class="en-qtext">' + esc(q.text) + '</p></div>' +
        '<div class="en-choices">' +
        q.choices.map(function (c, j) {
          return '<button type="button" class="en-choice' + (answers[i] === j ? ' is-selected' : '') + '" data-j="' + j +
            '"><span class="en-dot"></span><span>' + esc(c) + '</span></button>';
        }).join('') +
        '</div></div><p class="en-hint">' + esc(CONFIG.hint) + '</p></div>';

      var locked = false;
      Array.prototype.forEach.call(app.querySelectorAll('.en-choice'), function (btn) {
        btn.addEventListener('click', function () {
          if (locked) return;
          locked = true;
          answers[i] = +btn.getAttribute('data-j');
          save();
          Array.prototype.forEach.call(app.querySelectorAll('.en-choice'), function (b) { b.classList.remove('is-selected'); });
          btn.classList.add('is-selected');
          setTimeout(function () {
            if (i + 1 < total) showQuestion(i + 1); else showResult(judge(), true);
          }, 320);
        });
      });
      app.querySelector('.en-back').addEventListener('click', function () {
        if (i > 0) showQuestion(i - 1); else showIntro();
        scrollToApp();
      });
      scrollToApp();
    }

    function studentVoices() {
      var V = CONFIG.studentVoices;
      if (!V || !V.items.length) return '';
      return '<section class="en-voice"><p class="en-voice-title">' + nl(V.title) + '</p>' +
        V.items.map(function (v) {
          var body = esc(v.text);
          if (v.mark) body = body.replace(esc(v.mark), '<span class="en-mk">' + esc(v.mark) + '</span>');
          return '<figure class="en-vcard"><blockquote>' + body + '</blockquote><figcaption>' + esc(v.who) + '</figcaption></figure>';
        }).join('') + '</section>';
    }

    function showResult(type, withLoading) {
      if (withLoading) {
        app.innerHTML = '<div class="en-screen en-loading"><div class="en-breath">' + ART.sun + '</div><p>' + esc(CONFIG.loadingText) + '</p></div>';
        scrollToApp();
        setTimeout(function () { showResult(type, false); }, 1400);
        return;
      }
      var lock = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b9561f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
      var href = type.registerUrl || '#';
      app.innerHTML = '<div class="en-screen">' +
        '<section class="en-result" style="--type-bg:' + esc(type.bg) + '"><div class="en-chips"><span class="en-chip is-free">診断結果</span></div>' +
        '<p class="en-result-lead">' + esc(CONFIG.resultLead) + '</p>' +
        '<div class="en-art' + (type.img ? ' is-img' : '') + '">' + typeArt(type) + '</div>' +
        '<p class="en-catch">' + nl(type.catch) + '</p>' +
        (type.img ? '<p class="en-type-label">' + esc(type.label) + '</p>' // タイプ名はイラスト内に描かれている（alt に保持）。解説本の表記だけサブで添える（ぽち太さん指示 2026-10-01）
          : '<p class="en-type">' + type.name + '<small>' + esc(type.label) + '</small></p>') + // name は <wbr> を含む固定文（CONFIG内）
        '<div class="en-bubble">' + esc(type.hook) + '</div></section>' +
        '<div class="en-more"><span>' + esc(CONFIG.moreText) + '</span></div>' +
        '<section class="en-locked"><p class="en-sec">' + nl(CONFIG.lockedTitle) + (CONFIG.lockedTitleTag ? '<br><span class="en-nb">' + esc(CONFIG.lockedTitleTag) + '</span>' : '') + '</p>' +
        CONFIG.lockedItems.map(function (t) { return '<div class="en-lock">' + lock + '<span>' + esc(t) + '</span></div>'; }).join('') +
        '<div class="en-book">' + book3d(type, 92) + '<div><b>' + esc(CONFIG.bookLead) + '</b><span>' + esc(CONFIG.bookNote) + '</span></div></div>' +
        '</section>' + studentVoices() +
        '<div class="en-cta is-static"><a class="en-btn" href="' + esc(href) + '">' + esc(CONFIG.registerCta) + '</a><small>' + esc(CONFIG.registerNote) + '</small></div>' +
        '<button type="button" class="en-retry">もう一度診断する</button></div>';

      var reg = app.querySelector('.en-cta.is-static .en-btn');
      var bar = document.createElement('div');
      bar.className = 'en-sticky';
      bar.innerHTML = '<a class="en-btn" href="' + esc(href) + '">' + esc(CONFIG.registerCta) + '</a>';
      app.appendChild(bar);
      app.querySelector('.en-screen').classList.add('has-sticky');
      if (!type.registerUrl) {
        var toast = document.createElement('div');
        toast.className = 'en-toast'; toast.textContent = CONFIG.mockNotice;
        app.appendChild(toast);
        Array.prototype.forEach.call(app.querySelectorAll('.en-btn'), function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            toast.classList.add('on');
            clearTimeout(toast._t); toast._t = setTimeout(function () { toast.classList.remove('on'); }, 2400);
          });
        });
      }
      var syncBar = function () {
        if (!bar.isConnected) { window.removeEventListener('scroll', syncBar); window.removeEventListener('resize', syncBar); return; }
        var r = reg.getBoundingClientRect();
        bar.classList.toggle('is-hidden', r.top < window.innerHeight && r.bottom > 0);
      };
      window.addEventListener('scroll', syncBar, { passive: true });
      window.addEventListener('resize', syncBar);
      syncBar();
      app.querySelector('.en-retry').addEventListener('click', function () {
        answers = answers.map(function () { return null; });
        save();
        showQuestion(0);
      });
      scrollToApp();
    }

    function scrollToApp() {
      var rect = root.getBoundingClientRect();
      if (rect.top < 0 || rect.top > 140) {
        var top = rect.top + window.pageYOffset - 20;
        try { window.scrollTo({ top: top, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, top); }
      }
    }
    function save() {
      try { sessionStorage.setItem(CONFIG.storageKey, JSON.stringify(answers)); } catch (e) {}
    }
  });

  function restore(n) {
    var empty = []; for (var i = 0; i < n; i++) empty.push(null);
    try {
      var a = JSON.parse(sessionStorage.getItem(CONFIG.storageKey) || 'null');
      if (Array.isArray(a) && a.length === n && a.every(function (v, i) {
        return v === null || (typeof v === 'number' && v >= 0 && v < CONFIG.scores[i].length);
      })) return a;
    } catch (e) {}
    return empty;
  }
  // 仮枠のシルエット色：タイプの地色を濃くした色
  function darken(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#b9561f';
    var n = parseInt(m[1], 16), f = .55;
    var r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
